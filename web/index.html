<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amina · Banking Voice AI Support</title>
<style>
  :root { --bg:#1c1c1c; --panel:#262626; --line:#3a3a3a; --red:#d61a23; --text:#f2f2f2; --muted:#a8a8a8; --red-text:#ff5a61; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { border-top:6px solid var(--red); padding:20px 32px 8px; }
  header small { color:var(--red-text); letter-spacing:.05em; font-weight:600; }
  header h1 { margin:6px 0 0; font-size:28px; }
  main { display:grid; grid-template-columns: 1.3fr 1fr; gap:20px; padding:16px 32px 32px; height:calc(100vh - 110px); }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; display:flex; flex-direction:column; min-height:0; }
  h2 { margin:0 0 10px; font-size:15px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
  #log, #trace { flex:1; overflow-y:auto; }
  .msg { margin:8px 0; padding:10px 14px; border-radius:10px; max-width:85%; line-height:1.45; }
  .amina { background:#333; }
  .caller { background:var(--red); margin-left:auto; }
  .who { display:block; font-size:11px; opacity:.85; margin-bottom:2px; }
  .controls { display:flex; gap:10px; margin-top:12px; }
  button { background:var(--red); color:#fff; border:0; border-radius:999px; padding:12px 20px; font-size:15px; font-weight:600; cursor:pointer; }
  button.secondary { background:transparent; border:1px solid #fff; }
  button:disabled { opacity:.4; cursor:default; }
  button.listening { animation:pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 8px rgba(214,26,35,.35); } }
  input { flex:1; background:#1c1c1c; color:var(--text); border:1px solid var(--line); border-radius:999px; padding:12px 16px; font-size:15px; }
  .status { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .pill { border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:13px; color:var(--muted); }
  .pill.on { border-color:#3fb950; color:#3fb950; }
  .pill.warn { border-color:var(--red-text); color:var(--red-text); }
  .step { border-left:3px solid var(--red); padding:6px 10px; margin:8px 0; background:#1f1f1f; font-size:13px; }
  .step b { color:#fff; }
  .step pre { margin:4px 0 0; white-space:pre-wrap; word-break:break-word; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <small>REAL-TIME VOICE AI SUPPORT · DEMO v0</small>
  <h1>Amina</h1>
</header>
<main>
  <section>
    <h2>Call</h2>
    <div class="status">
      <span class="pill" id="pVerified">Not verified</span>
      <span class="pill" id="pTransfer">With Amina</span>
      <span class="pill" id="pCall">No call</span>
    </div>
    <div id="log"></div>
    <div class="controls">
      <button id="start">Start call</button>
      <button id="talk" disabled>🎤 Talk</button>
      <input id="text" dir="auto" placeholder="…or type what the caller says" disabled>
      <button id="send" class="secondary" disabled>Send</button>
    </div>
  </section>
  <section>
    <h2>Behind the scenes</h2>
    <div id="trace"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let callId = null, audio = null, busy = false;

function addMsg(who, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.dir = 'auto';
  div.innerHTML = `<span class="who">${who === 'amina' ? 'Amina' : 'Caller'}</span>`;
  div.appendChild(document.createTextNode(text));
  $('log').appendChild(div);
  $('log').scrollTop = $('log').scrollHeight;
}

function addTrace(steps) {
  for (const s of steps) {
    const div = document.createElement('div');
    div.className = 'step';
    div.innerHTML = `<b>${s.tool}</b>`;
    const pre = document.createElement('pre');
    pre.textContent = (s.args && Object.keys(s.args).length ? 'args: ' + JSON.stringify(s.args) + '\n' : '')
                    + 'result: ' + JSON.stringify(s.result, null, 1);
    div.appendChild(pre);
    $('trace').appendChild(div);
  }
  $('trace').scrollTop = $('trace').scrollHeight;
}

function stopSpeaking() {
  if (audio) { audio.pause(); audio = null; }
  speechSynthesis.cancel();
}

async function speak(text) {
  stopSpeaking();
  try {
    const r = await fetch('/tts', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text }) });
    if (!r.ok) throw new Error('tts ' + r.status);
    audio = new Audio(URL.createObjectURL(await r.blob()));
    await audio.play();
  } catch (e) {
    const u = new SpeechSynthesisUtterance(text);   // fallback voice in the browser
    u.lang = 'ar-EG';
    u.rate = 0.95;
    speechSynthesis.speak(u);
  }
}

async function startCall() {
  stopSpeaking();
  $('log').innerHTML = ''; $('trace').innerHTML = '';
  const r = await (await fetch('/call/start', { method:'POST' })).json();
  callId = r.call_id;
  $('pCall').textContent = 'Call #' + callId;
  $('pVerified').textContent = 'Not verified'; $('pVerified').className = 'pill';
  $('pTransfer').textContent = 'With Amina'; $('pTransfer').className = 'pill';
  ['talk','text','send'].forEach(id => $(id).disabled = false);
  $('start').textContent = 'New call';
  addMsg('amina', r.reply);
  speak(r.reply);
}

async function say(text) {
  text = text.trim();
  if (!text || !callId || busy) return;
  busy = true;
  stopSpeaking();
  addMsg('caller', text);
  const t0 = performance.now();
  try {
    const r = await (await fetch(`/call/${callId}/say`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text }) })).json();
    addTrace(r.trace || []);
    addTrace([{ tool: 'latency', result: Math.round(performance.now() - t0) + ' ms (agent + tools)' }]);
    addMsg('amina', r.reply);
    if (r.verified) { $('pVerified').textContent = 'Verified'; $('pVerified').className = 'pill on'; }
    if (r.transferred) {
      $('pTransfer').textContent = 'Transferred to staff'; $('pTransfer').className = 'pill warn';
      ['talk','text','send'].forEach(id => $(id).disabled = true);
    }
    speak(r.reply);
  } finally { busy = false; }
}

// Speech to text in the browser (Chrome / Edge).
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (SR) {
  rec = new SR();
  rec.lang = 'ar-EG';
  rec.interimResults = false;
  rec.onresult = e => say(e.results[0][0].transcript);
  rec.onend = () => $('talk').classList.remove('listening');
  rec.onerror = () => $('talk').classList.remove('listening');
} else {
  $('talk').title = 'Speech recognition needs Chrome or Edge. Type instead.';
}

$('start').onclick = startCall;
$('talk').onclick = () => {
  stopSpeaking();                // barge-in: talking stops Amina at once
  if (!rec) return;
  $('talk').classList.add('listening');
  try { rec.start(); } catch (e) {}
};
$('send').onclick = () => { say($('text').value); $('text').value = ''; };
$('text').onkeydown = e => { if (e.key === 'Enter') $('send').onclick(); else stopSpeaking(); };
</script>
</body>
</html>
